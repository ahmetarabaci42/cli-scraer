[package]
name = "cli-scraper"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
scraper = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
